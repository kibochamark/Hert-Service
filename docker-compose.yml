services:
  hert-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: hert-service
    ports:
      - "4000:4000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      redis-service:
        condition: service_healthy

  redis-service:
    image: redis:7.0.11-alpine
    container_name: redis-service
    ports:
      - "6379:6379"
    env_file:
      - .env
    volumes:
      - redis-data:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --bind 0.0.0.0
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
    driver: local